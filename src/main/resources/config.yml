# Economy Plugin Configuration
# Currency symbol and formatting
currency:
  symbol: "$"
  format: "%,.2f"
  starting-balance: 100.0

# Market settings
market:
  # How often prices update (in minutes)
  update-interval: 3
  # Price fluctuation range (0.1 = 10% max change)
  fluctuation-range: 0.25
  # Minimum price multiplier (prevents items from becoming too cheap)
  min-price-multiplier: 0.05
  # Maximum price multiplier (prevents items from becoming too expensive)
  max-price-multiplier: 10.0
  # Supply/demand impact on prices
  supply-demand-impact: 0.5
  # How quickly supply/demand levels decay towards neutral
  decay-rate: 0.8
  # Minimum price for any item
  min-price: 0.01

# Item base prices (in dollars) - Only Building Blocks, Ores, and Food
